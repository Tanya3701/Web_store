<!doctype html>
<html lang="ru">
  <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Главная</title>
      <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="row">
        <div class="col-3">
            <div class="card text-bg-dark mb-10" style="max-width: 18rem;">
                <div class="card-body">
                    <div class="row">
                        <div class="col-3">
                            <img src="images/menu.png" class="img-fluid" alt="...">
                        </div>
                        <div class="col-9">
                            <h4>Меню</h4>
                        </div>
                    </div>
                    <hr class="border border-light border-1 opacity-50">
                    <div class="btn-group-vertical" role="group" aria-label="Группа вертикальных кнопок">
                        <button type="button" class="btn btn-dark">
                            <div class="row">
                                <div class="col-3">
                                    <img src="images/main.png" class="img-fluid" alt="...">
                                </div>
                                <div class="col-9">
                                    <h5>Главная</h5>
                                </div>
                            </div>
                        </button>
                        <button type="button" class="btn btn-dark">
                            <div class="row">
                                <div class="col-3">
                                    <img src="images/category.png" class="img-fluid" alt="...">
                                </div>
                                <div class="col-9">
                                    <h5>Категории</h5>
                                </div>
                            </div>
                        </button>
                        <button type="button" class="btn btn-dark">
                            <div class="row">
                                <div class="col-3">
                                    <img src="images/orders.png" class="img-fluid" alt="...">
                                </div>
                                <div class="col-9">
                                    <h5>Заказы</h5>
                                </div>
                            </div>
                        </button>
                        <button type="button" class="btn btn-dark">
                            <div class="row">
                                <div class="col-3">
                                    <img src="images/contacts.png" class="img-fluid" alt="...">
                                </div>
                                <div class="col-9">
                                    <h5>Контакты</h5>
                                </div>
                            </div>
                        </button>
                        <div class="row mt-5"></div>
                        <div class="row mt-5"></div>
                        <div class="row mt-5"></div>
                        <div class="row mt-5"></div>
                        <div class="row mt-5"></div>
                        <div class="row mt-5"></div>
                        <div class="row mt-5"></div>
                        <div class="btn-group dropup">
                            <button type="button" class="btn btn-dark dropdown-toggle" id="dropdownMenuButton2" data-bs-toggle="dropdown">
                                <hr class="border border-light border-1 opacity-50">
                                <div class="row">
                                    <div class="col-3">
                                        <img src="images/user.png" class="img-fluid" alt="...">
                                    </div>
                                        <div class="col-9">
                                            <h6>Пользователь</h6>
                                        </div>
                                    </div>
                                <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="dropdownMenuButton2">
                                <li><a class="dropdown-item" href="">Профиль</a></li>
                                <li><a class="dropdown-item" href="">Выход</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-9">
            <div class="row mt-5"></div>
            <div class="row mt-5"></div>
            <div class="row mt-5">
                <div class="col-4">
                    <div class="card" style="width: 21rem;">
                        <div class="card-body">
                            Имя
                            <div class="input-group mb-3">
                               <input type="text" class="form-control" aria-label="Имя пользователя" aria-describedby="basic-addon1">
                           </div>
                            Почта
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">@</span>
                               <input type="text" class="form-control" aria-label="Имя пользователя" aria-describedby="basic-addon1">
                           </div>
                            Сообщение
                            <div class="input-group">
                                <textarea class="form-control" aria-label="С текстовым полем"></textarea>
                            </div>
                            <div class="row mt-2"></div>
                            <button type="button" class="btn btn-secondary">Отправить</button>
                        </div>
                    </div>
                </div>
                <div class="col-8">
                    <div class="card border-light mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Наши контакты</h5>
                            <dl class="row">
                                <dt class="col-sm-3">Адрес</dt>
                                <dd class="col-sm-9">Россия г.Санкт-Петербург, ул. миллионная 39</dd>
                                <dt class="col-sm-3">Телефон</dt>
                                <dd class="col-sm-9">+7-777-777-77-77</dd>
                                <dt class="col-sm-3">Рабочие часы</dt>
                                <dd class="col-sm-9">Всегда, круглосуточно, без выходных, без обеда</dd>
                                <dt class="col-sm-3">E-mail</dt>
                                <dd class="col-sm-9">nash_adres@mail.ru</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
    </div>
  </body>
</html>
